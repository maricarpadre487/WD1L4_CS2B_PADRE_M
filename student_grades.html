<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Grades</title>

  <!-- external css file, inside the css folder -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <h1>List of Enrolled Students</h1>

  <!-- table of the students and their grades -->
  <table>
    <tr>
      <th>Student Name</th>
      <th>Grade</th>
    </tr>

    <tr>
      <td>Anna Reyes</td>
      <td>92</td>
    </tr>

    <tr>
      <td>Ben Santos</td>
      <td>85</td>
    </tr>

    <tr>
      <td>Carla Cruz</td>
      <td>78</td>
    </tr>

    <tr>
      <td>David Lim</td>
      <td>97</td>
    </tr>

    <tr>
      <td>Ella Ramos</td>
      <td>74</td>
    </tr>
  </table>

  <!-- when clicked, it runs showGradeEquivalent() from the js file -->
  <button onclick="showGradeEquivalent()">Show Grade Equivalent</button>

  <!-- the result table will show up here -->
  <div id="result"></div>

  <!-- external js file, inside the js folder (placed last so the page loads first) -->
  <script src="js/script.js"></script>

</body>
</html>
